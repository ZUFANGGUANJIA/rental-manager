<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<title>租房管家</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  :root{
    --bg:#f4f5fb; --card:#ffffff; --ink:#1f2330; --sub:#8a90a6;
    --line:#eceef5; --brand:#4f46e5; --brand2:#7c6bff;
    --paid:#16a34a; --soon:#f59e0b; --over:#ef4444; --wait:#3b82f6; --vac:#6b7280;
    --shadow:0 8px 24px rgba(31,35,48,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  body{max-width:480px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  /* login */
  #login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#4f46e5,#7c6bff 60%,#22d3ee);}
  #login .blur{position:absolute;inset:0;backdrop-filter:blur(2px);opacity:.0;}
  .login-card{position:relative;width:84%;max-width:330px;background:#fff;border-radius:22px;padding:30px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.25);text-align:center;}
  .login-card .logo{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;
    background:linear-gradient(160deg,#4f46e5,#22d3ee);display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:30px;font-weight:800;box-shadow:0 8px 20px rgba(79,70,229,.4);}
  .login-card h1{margin:0 0 4px;font-size:21px;letter-spacing:1px;}
  .login-card p{margin:0 0 20px;color:var(--sub);font-size:13px;}
  .login-card input{width:100%;padding:13px 14px;margin-bottom:12px;border:1px solid var(--line);
    border-radius:12px;font-size:15px;background:#fafbff;outline:none;}
  .login-card input:focus{border-color:var(--brand);}
  .login-card button{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:700;
    color:#fff;background:linear-gradient(135deg,#4f46e5,#7c6bff);box-shadow:0 8px 18px rgba(79,70,229,.35);}
  .login-err{color:var(--over);font-size:12.5px;min-height:16px;margin:-4px 0 8px;}
  .shake{animation:sk .4s;}
  @keyframes sk{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

  /* header */
  header{background:linear-gradient(135deg,#4f46e5,#7c6bff 70%,#22d3ee);color:#fff;padding:18px 18px 14px;
    border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(79,70,229,.25);}
  header .row{display:flex;align-items:center;justify-content:space-between;}
  header .title{font-size:20px;font-weight:800;letter-spacing:1px;}
  header .date{font-size:12.5px;opacity:.92;}
  header .stat-strip{display:flex;gap:10px;margin-top:14px;}
  .chip{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:9px 10px;}
  .chip .n{font-size:18px;font-weight:800;}
  .chip .t{font-size:11px;opacity:.9;margin-top:1px;}
  .chip.warn .n{color:#ffe08a;}
  .chip.danger .n{color:#ffb4b4;}

  main{flex:1;overflow-y:auto;padding:16px 14px 96px;-webkit-overflow-scrolling:touch;}
  .view{display:none;}
  .view.active{display:block;}

  .section-title{font-size:14px;font-weight:700;color:var(--sub);margin:6px 4px 10px;display:flex;
    justify-content:space-between;align-items:center;}
  .section-title .link{color:var(--brand);font-size:13px;font-weight:600;}

  .card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);
    border:1px solid var(--line);}
  .prop{display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .08s;}
  .prop:active{transform:scale(.99);}
  .prop .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .prop .name{font-size:16.5px;font-weight:700;}
  .prop .addr{font-size:12.5px;color:var(--sub);margin-top:2px;}
  .badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;white-space:nowrap;}
  .prop .mid{display:flex;justify-content:space-between;align-items:flex-end;}
  .prop .rent{font-size:15px;font-weight:700;}
  .prop .rent small{font-size:11px;color:var(--sub);font-weight:500;}
  .prop .due{font-size:12.5px;color:var(--sub);text-align:right;}
  .prop .due b{color:var(--ink);}
  .prop .note{font-size:12px;color:var(--sub);background:#f7f8fc;border-radius:8px;padding:6px 8px;
    border-left:3px solid var(--brand2);}
  .prop.vacant{opacity:.72;}
  .prop.vacant .name{color:var(--vac);}

  .empty{text-align:center;color:var(--sub);padding:50px 20px;}
  .empty .big{font-size:46px;margin-bottom:10px;}

  .fab{position:fixed;right:max(18px,calc(50% - 222px));bottom:84px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,#4f46e5,#7c6bff);color:#fff;border:none;font-size:28px;font-weight:300;
    box-shadow:0 10px 24px rgba(79,70,229,.45);z-index:20;display:none;}
  .fab.show{display:block;}

  /* bottom nav */
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
    background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 0 calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.05);z-index:30;}
  nav .item{flex:1;text-align:center;color:var(--sub);font-size:11px;padding:4px 0;cursor:pointer;}
  nav .item .ic{font-size:21px;display:block;line-height:1.1;margin-bottom:2px;}
  nav .item.active{color:var(--brand);font-weight:700;}

  /* modal / sheet */
  .overlay{position:fixed;inset:0;background:rgba(15,18,38,.5);z-index:40;display:none;
    align-items:flex-end;justify-content:center;}
  .overlay.show{display:flex;animation:fade .2s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px 24px;
    max-height:88vh;overflow-y:auto;animation:up .25s ease;}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h2{margin:0 0 14px;font-size:18px;}
  .sheet .field{margin-bottom:12px;}
  .sheet label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px;font-weight:600;}
  .sheet input,.sheet select,.sheet textarea{width:100%;padding:12px;border:1px solid var(--line);
    border-radius:11px;font-size:15px;background:#fafbff;outline:none;font-family:inherit;}
  .sheet input:focus,.sheet select:focus,.sheet textarea:focus{border-color:var(--brand);}
  .sheet textarea{resize:vertical;min-height:60px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;padding:11px;border:1px solid var(--line);background:#fafbff;border-radius:11px;
    font-size:14px;color:var(--sub);font-weight:600;}
  .seg button.on{background:var(--brand);color:#fff;border-color:var(--brand);}
  .btn-row{display:flex;gap:10px;margin-top:8px;}
  .btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
  .btn.primary{background:linear-gradient(135deg,#4f46e5,#7c6bff);color:#fff;}
  .btn.ghost{background:#f1f2f8;color:var(--ink);}
  .btn.danger{background:#fee2e2;color:var(--over);}
  .pay-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .pay-item .pi-l .pi-d{font-size:14px;font-weight:600;}
  .pay-item .pi-l .pi-n{font-size:12px;color:var(--sub);margin-top:2px;}
  .pay-item .pi-r{display:flex;align-items:center;gap:10px;}
  .pay-item .pi-am{font-weight:700;font-size:14.5px;}
  .pay-item .pi-act{color:var(--brand);font-size:13px;cursor:pointer;}
  .pay-item .pi-del{color:var(--over);font-size:13px;cursor:pointer;}

  /* stats */
  .big-num{font-size:30px;font-weight:800;color:var(--brand);}
  .bar-row{margin-bottom:12px;}
  .bar-row .bl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .bar-row .bl .bn{font-weight:600;}
  .bar-row .bl .bv{color:var(--sub);}
  .bar-track{height:12px;background:#eef0f7;border-radius:999px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#4f46e5,#7c6bff);}
  .rank-medal{font-size:15px;margin-right:6px;}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(31,35,48,.92);
    color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .25s;
    pointer-events:none;max-width:80%;text-align:center;}
  .toast.show{opacity:1;}

  .me-row{display:flex;align-items:center;justify-content:space-between;padding:15px 14px;background:#fff;
    border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);}
  .me-row .ml{display:flex;align-items:center;gap:12px;}
  .me-row .mi{font-size:22px;width:30px;text-align:center;}
  .me-row .mt{font-size:15px;font-weight:600;}
  .me-row .mr{color:var(--sub);font-size:18px;}
  .me-sub{font-size:11.5px;color:var(--sub);text-align:center;margin-top:14px;}
  .imp-hint{font-size:11.5px;color:var(--sub);text-align:center;margin-top:6px;}
</style>
</head>
<body>
<div id="login">
  <div class="login-card" id="loginCard">
    <div class="logo">租</div>
    <h1>租房管家</h1>
    <p>手机版 · 房租到期提醒与收租管理</p>
    <input id="lu" placeholder="账号" autocomplete="off" />
    <input id="lp" type="password" placeholder="密码" />
    <div class="login-err" id="loginErr"></div>
    <button id="loginBtn">登 录</button>
  </div>
</div>

<div class="app" id="app" style="display:none;">
  <header>
    <div class="row">
      <div class="title">租房管家</div>
      <div class="date" id="hdrDate"></div>
    </div>
    <div class="stat-strip" id="hdrStrip"></div>
  </header>

  <main>
    <!-- 房产 -->
    <section class="view active" id="view-props">
      <div class="section-title">我的房产 <span class="link" id="addPropLink">+ 添加</span></div>
      <div id="propList"></div>
    </section>

    <!-- 收租 -->
    <section class="view" id="view-collect">
      <div class="section-title">待办 / 临近到期</div>
      <div id="todoList"></div>
      <div class="section-title" style="margin-top:18px;">最近收租记录</div>
      <div id="recentList"></div>
    </section>

    <!-- 统计 -->
    <section class="view" id="view-stats">
      <div class="section-title">今年收入统计（<span id="statYear"></span>）</div>
      <div class="card">
        <div style="color:var(--sub);font-size:12.5px;">全部房产今年已收合计</div>
        <div class="big-num" id="totalYear"></div>
      </div>
      <div class="card" id="perPropCard">
        <div style="font-weight:700;margin-bottom:12px;">每套房产今年收入</div>
        <div id="perPropBars"></div>
      </div>
      <div class="card" id="rankCard">
        <div style="font-weight:700;margin-bottom:12px;">总收入高低排名</div>
        <div id="rankBars"></div>
      </div>
      <div class="card" id="vacCard">
        <div style="font-weight:700;margin-bottom:8px;">空置情况</div>
        <div id="vacInfo"></div>
      </div>
    </section>

    <!-- 我的 -->
    <section class="view" id="view-me">
      <div class="section-title">设置</div>
      <div class="me-row" id="meExport"><div class="ml"><div class="mi">📤</div><div class="mt">导出备份</div></div><div class="mr">›</div></div>
      <div class="me-row" id="meImport"><div class="ml"><div class="mi">📥</div><div class="mt">导入备份</div></div><div class="mr">›</div></div>
      <div class="me-row" id="meLogout"><div class="ml"><div class="mi">🔒</div><div class="mt">退出登录</div></div><div class="mr">›</div></div>
      <div class="me-sub">租房管家 · 手机版 v1.0<br/>账号 walkercoo · 数据仅保存在本机</div>
      <div class="imp-hint">提示：安卓 Chrome 打开后，点右上角 ⋮ → “添加到主屏幕”，即可像 App 一样使用。</div>
      <input type="file" id="fileInput" accept="application/json,.json" style="display:none;" />
    </section>
  </main>

  <button class="fab" id="fab">+</button>

  <nav>
    <div class="item active" data-view="props"><span class="ic">🏠</span>房产</div>
    <div class="item" data-view="collect"><span class="ic">💰</span>收租</div>
    <div class="item" data-view="stats"><span class="ic">📊</span>统计</div>
    <div class="item" data-view="me"><span class="ic">👤</span>我的</div>
  </nav>
</div>

<!-- property modal -->
<div class="overlay" id="propOverlay">
  <div class="sheet">
    <h2 id="propTitle">添加房产</h2>
    <div class="field">
      <label>房产名称 / 房号</label>
      <input id="f_name" placeholder="例：阳光小区 2栋 301" />
    </div>
    <div class="field">
      <label>地址（选填）</label>
      <input id="f_addr" placeholder="详细地址" />
    </div>
    <div class="field">
      <label>租金（元）</label>
      <input id="f_rent" type="number" inputmode="decimal" placeholder="例：2000" />
    </div>
    <div class="field">
      <label>收租周期</label>
      <div class="seg" id="f_cycleSeg">
        <button data-v="monthly" class="on">按月</button>
        <button data-v="quarterly">按季</button>
      </div>
    </div>
    <div class="field">
      <label>房产状态</label>
      <div class="seg" id="f_statusSeg">
        <button data-v="renting" class="on">出租中</button>
        <button data-v="vacant">空置/退招租</button>
      </div>
    </div>
    <div class="field" id="vacField" style="display:none;">
      <label>空置起始日</label>
      <input id="f_vacantSince" type="date" />
    </div>
    <div class="field">
      <label>备注（选填）</label>
      <textarea id="f_note" placeholder="例：租客张三，合同到明年3月"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="propCancel">取消</button>
      <button class="btn primary" id="propSave">保存</button>
    </div>
  </div>
</div>

<!-- payment modal -->
<div class="overlay" id="payOverlay">
  <div class="sheet">
    <h2 id="payTitle">收租</h2>
    <div class="field">
      <label>金额（元）</label>
      <input id="p_amount" type="number" inputmode="decimal" />
    </div>
    <div class="field">
      <label>收款日期</label>
      <input id="p_date" type="date" />
    </div>
    <div class="field">
      <label>备注（选填）</label>
      <textarea id="p_note" placeholder="例：微信转账 / 现金 / 含水电气"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="payCancel">取消</button>
      <button class="btn primary" id="paySave">保存</button>
    </div>
  </div>
</div>

<!-- detail sheet -->
<div class="overlay" id="sheetOverlay">
  <div class="sheet" id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const LS='rental_mobile_v1';
const SOON_DAYS=3;
const CRED={u:'walkercoo',p:'888888'};
let state={properties:[]};
let logged=false;
let editingPropId=null;
let editingPayPropId=null, editingPayId=null;
let sheetPropId=null;
let curCycle='monthly', curStatus='renting';

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function today(){const d=new Date();d.setHours(0,0,0,0);return d;}
function parseD(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;}
function fmtDate(s){if(!s)return '';const d=parseD(s);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
function fmtMoney(n){return '¥'+(Number(n||0)).toLocaleString('zh-CN',{maximumFractionDigits:2});}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(!d)return {properties:[]};if(!d.properties)d.properties=[];return migrate(d);}catch(e){return {properties:[]};}}
function migrate(d){d.properties.forEach(p=>{if(!p.pstatus)p.pstatus='renting';if(p.cycle!=='quarterly')p.cycle='monthly';if(!p.payments)p.payments=[];p.payments.forEach(pm=>{if(!pm.id)pm.id=uid();});});return d;}
function save(){localStorage.setItem(LS,JSON.stringify(state));}

function lastPayment(p){if(!p.payments.length)return null;return p.payments.reduce((a,b)=>parseD(a.date)>parseD(b.date)?a:b);}
function nextDueOf(p){const lp=lastPayment(p);if(!lp)return null;const d=parseD(lp.date);const m=p.cycle==='quarterly'?3:1;d.setMonth(d.getMonth()+m);return d;}
function statusOf(p){
  if(p.pstatus==='vacant'){
    let days=null;
    if(p.vacantSince){days=Math.round((today()-parseD(p.vacantSince))/86400000);}
    return {status:'vacant',text:(days!=null&&days>=0)?('空置招租 '+days+' 天'):'空置招租中',color:'var(--vac)',rank:3};
  }
  const nd=nextDueOf(p);
  if(!nd) return {status:'waiting',text:'待首期收租',color:'var(--wait)',rank:2};
  const diff=Math.round((nd-today())/86400000);
  if(diff<0) return {status:'overdue',text:'逾期 '+Math.abs(diff)+' 天',color:'var(--over)',rank:0};
  if(diff===0) return {status:'soon',text:'今天到期',color:'var(--soon)',rank:1};
  if(diff<=SOON_DAYS) return {status:'soon',text:'还有 '+diff+' 天到期',color:'var(--soon)',rank:1};
  return {status:'paid',text:'房租已交',color:'var(--paid)',rank:4};
}
function yearlyIncome(p,year){return p.payments.filter(pm=>{const d=parseD(pm.date);return d&&d.getFullYear()===year;}).reduce((s,pm)=>s+Number(pm.amount||0),0);}

function statusColorVar(s){return ({paid:'var(--paid)',soon:'var(--soon)',overdue:'var(--over)',waiting:'var(--wait)',vacant:'var(--vac)'})[s];}

/* ---------- render ---------- */
function render(){
  renderHeader();
  renderProps();
  renderCollect();
  renderStats();
}
function renderHeader(){
  const d=today();
  const wk=['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('hdrDate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk;
  const props=state.properties;
  const overdue=props.filter(p=>statusOf(p).status==='overdue').length;
  const soon=props.filter(p=>statusOf(p).status==='soon').length;
  const vac=props.filter(p=>p.pstatus==='vacant').length;
  document.getElementById('hdrStrip').innerHTML=
    '<div class="chip'+(overdue?' danger':'')+'"><div class="n">'+overdue+'</div><div class="t">逾期</div></div>'+
    '<div class="chip'+(soon?' warn':'')+'"><div class="n">'+soon+'</div><div class="t">临近</div></div>'+
    '<div class="chip"><div class="n">'+vac+'</div><div class="t">空置</div></div>'+
    '<div class="chip"><div class="n">'+props.length+'</div><div class="t">房产</div></div>';
}
function renderProps(){
  const list=document.getElementById('propList');
  if(!state.properties.length){
    list.innerHTML='<div class="empty"><div class="big">🏠</div>还没有房产<br/>点右下角 “+” 添加第一套吧</div>';return;
  }
  const arr=state.properties.slice().sort((a,b)=>statusOf(a).rank-statusOf(b).rank);
  list.innerHTML=arr.map(p=>{
    const st=statusOf(p);
    const isVac=p.pstatus==='vacant';
    const dueTxt=isVac?('空置起始：'+(p.vacantSince?fmtDate(p.vacantSince):'—'))
      :('下次到期：<b>'+(nextDueOf(p)?fmtDate(nextDueOf(p).toISOString().slice(0,10)):'—')+'</b>');
    const note=p.note?'<div class="note">'+esc(p.note)+'</div>':'';
    return '<div class="card prop'+(isVac?' vacant':'')+'" data-pid="'+p.id+'">'+
      '<div class="top"><div><div class="name">'+esc(p.name)+'</div>'+(p.address?'<div class="addr">'+esc(p.address)+'</div>':'')+'</div>'+
      '<span class="badge" style="background:'+st.color+'">'+st.text+'</span></div>'+
      '<div class="mid"><div class="rent">'+fmtMoney(p.rent)+' <small>/'+(p.cycle==='quarterly'?'季':'月')+'</small></div>'+
      '<div class="due">'+dueTxt+'</div></div>'+note+'</div>';
  }).join('');
  list.querySelectorAll('.prop').forEach(el=>el.onclick=()=>openSheet(el.dataset.pid));
}
function renderCollect(){
  const todo=document.getElementById('todoList');
  const recent=document.getElementById('recentList');
  const need=state.properties.filter(p=>{const s=statusOf(p).status;return s==='overdue'||s==='soon'||s==='waiting';})
    .sort((a,b)=>statusOf(a).rank-statusOf(b).rank);
  if(!need.length){todo.innerHTML='<div class="empty"><div class="big">✅</div>暂无到期待办，状态良好</div>';}
  else{
    todo.innerHTML=need.map(p=>{
      const st=statusOf(p);
      return '<div class="card prop" data-pid="'+p.id+'" style="cursor:pointer">'+
        '<div class="top"><div class="name">'+esc(p.name)+'</div><span class="badge" style="background:'+st.color+'">'+st.text+'</span></div>'+
        '<div class="mid"><div class="rent">'+fmtMoney(p.rent)+' <small>/'+(p.cycle==='quarterly'?'季':'月')+'</small></div>'+
        '<div class="due">点此收租 ›</div></div></div>';
    }).join('');
    todo.querySelectorAll('.prop').forEach(el=>el.onclick=()=>openSheet(el.dataset.pid));
  }
  const allp=[];
  state.properties.forEach(p=>p.payments.forEach(pm=>allp.push({p,pm})));
  allp.sort((a,b)=>parseD(b.pm.date)-parseD(a.pm.date));
  const top=allp.slice(0,12);
  if(!top.length){recent.innerHTML='<div class="empty">还没有收租记录</div>';}
  else{
    recent.innerHTML=top.map(o=>{
      return '<div class="pay-item"><div class="pi-l"><div class="pi-d">'+esc(o.p.name)+'</div>'+
        '<div class="pi-n">'+fmtDate(o.pm.date)+(o.pm.note?' · '+esc(o.pm.note):'')+'</div></div>'+
        '<div class="pi-r"><div class="pi-am">'+fmtMoney(o.pm.amount)+'</div></div></div>';
    }).join('');
  }
}
function renderStats(){
  const year=today().getFullYear();
  document.getElementById('statYear').textContent=year;
  const total=state.properties.reduce((s,p)=>s+yearlyIncome(p,year),0);
  document.getElementById('totalYear').textContent=fmtMoney(total);
  const per=state.properties.map(p=>({name:p.name,val:yearlyIncome(p,year)})).filter(x=>x.val>0);
  const maxP=Math.max(1,...per.map(x=>x.val));
  document.getElementById('perPropBars').innerHTML=per.length?per.map(x=>
    '<div class="bar-row"><div class="bl"><span class="bn">'+esc(x.name)+'</span><span class="bv">'+fmtMoney(x.val)+'</span></div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+(x.val/maxP*100)+'%"></div></div></div>').join('')
    :'<div style="color:var(--sub);font-size:13px;">今年暂无收入记录</div>';
  const ranked=state.properties.map(p=>({name:p.name,val:yearlyIncome(p,year)})).sort((a,b)=>b.val-a.val);
  const maxR=Math.max(1,...ranked.map(x=>x.val));
  const medals=['🥇','🥈','🥉'];
  document.getElementById('rankBars').innerHTML=ranked.length?ranked.map((x,i)=>
    '<div class="bar-row"><div class="bl"><span class="bn"><span class="rank-medal">'+(medals[i]||(i+1)+'.')+'</span>'+esc(x.name)+'</span><span class="bv">'+fmtMoney(x.val)+'</span></div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+(x.val/maxR*100)+'%"></div></div></div>').join('')
    :'<div style="color:var(--sub);font-size:13px;">暂无数据</div>';
  const vac=state.properties.filter(p=>p.pstatus==='vacant');
  document.getElementById('vacInfo').innerHTML=vac.length?vac.map(p=>{
    let days='';if(p.vacantSince){days='（'+Math.round((today()-parseD(p.vacantSince))/86400000)+' 天）';}
    return '<div class="pay-item"><div class="pi-l"><div class="pi-d">'+esc(p.name)+'</div><div class="pi-n">空置招租中'+days+'</div></div></div>';
  }).join('')+'<div style="font-size:12px;color:var(--sub);margin-top:6px;">共 '+vac.length+' 套空置，建议尽快招租。</div>'
    :'<div style="color:var(--paid);font-size:13px;">✓ 暂无空置房产</div>';
}

/* ---------- sheet ---------- */
function openSheet(pid){
  sheetPropId=pid;
  const p=state.properties.find(x=>x.id===pid);if(!p)return;
  const st=statusOf(p);
  const pays=p.payments.slice().sort((a,b)=>parseD(b.date)-parseD(a.date));
  let html='<h2>'+esc(p.name)+'</h2>';
  html+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">'+
    '<span class="badge" style="background:'+st.color+'">'+st.text+'</span>'+
    '<span class="badge" style="background:#eef0f7;color:#555;">'+fmtMoney(p.rent)+'/'+(p.cycle==='quarterly'?'季':'月')+'</span>'+
    (p.address?'<span class="badge" style="background:#eef0f7;color:#555;">'+esc(p.address)+'</span>':'')+'</div>';
  if(pays.length){
    html+='<div style="font-weight:700;margin:6px 0 4px;">收租记录</div>';
    html+=pays.map(pm=>'<div class="pay-item"><div class="pi-l"><div class="pi-d">'+fmtMoney(pm.amount)+' · '+fmtDate(pm.date)+
      '</div>'+(pm.note?'<div class="pi-n">'+esc(pm.note)+'</div>':'')+'</div>'+
      '<div class="pi-r"><span class="pi-act" data-editpay="'+pm.id+'">改</span><span class="pi-del" data-delpay="'+pm.id+'">删</span></div></div>').join('');
  } else {
    html+='<div style="color:var(--sub);font-size:13px;padding:8px 0;">还没有收租记录</div>';
  }
  html+='<div class="btn-row" style="margin-top:14px;">'+
    (p.pstatus==='vacant'
      ? '<button class="btn ghost" id="shReg">登记租客</button>'
      : '<button class="btn primary" id="shCollect">收租</button>')+
    '<button class="btn ghost" id="shEdit">编辑房产</button></div>';
  html+='<div class="btn-row"><button class="btn danger" id="shDel">删除房产</button>'+
    '<button class="btn ghost" id="shClose">关闭</button></div>';
  document.getElementById('sheetBody').innerHTML=html;
  showOverlay('sheetOverlay');
  const collect=document.getElementById('shCollect');if(collect)collect.onclick=()=>openPay(pid,null);
  const reg=document.getElementById('shReg');if(reg)reg.onclick=()=>editProp(pid);
  document.getElementById('shEdit').onclick=()=>editProp(pid);
  document.getElementById('shClose').onclick=()=>hideOverlay('sheetOverlay');
  document.getElementById('shDel').onclick=()=>{
    if(confirm('确定删除「'+p.name+'」及其所有收租记录？')){
      state.properties=state.properties.filter(x=>x.id!==pid);save();hideOverlay('sheetOverlay');render();toast('已删除');
    }
  };
  sheetBody.querySelectorAll('[data-editpay]').forEach(el=>el.onclick=()=>openPay(pid,el.dataset.editpay));
  sheetBody.querySelectorAll('[data-delpay]').forEach(el=>el.onclick=()=>{
    if(confirm('删除这条收租记录？')){
      const pr=state.properties.find(x=>x.id===pid);
      pr.payments=pr.payments.filter(x=>x.id!==el.dataset.delpay);save();openSheet(pid);render();toast('已删除记录');
    }
  });
}

/* ---------- property modal ---------- */
function openPropModal(){
  editingPropId=null;
  document.getElementById('propTitle').textContent='添加房产';
  document.getElementById('f_name').value='';
  document.getElementById('f_addr').value='';
  document.getElementById('f_rent').value='';
  document.getElementById('f_note').value='';
  document.getElementById('f_vacantSince').value='';
  setSeg('f_cycleSeg','monthly');setSeg('f_statusSeg','renting');syncVac();
  showOverlay('propOverlay');
}
function editProp(pid){
  const p=state.properties.find(x=>x.id===pid);if(!p)return;
  editingPropId=pid;hideOverlay('sheetOverlay');
  document.getElementById('propTitle').textContent='编辑房产';
  document.getElementById('f_name').value=p.name;
  document.getElementById('f_addr').value=p.address||'';
  document.getElementById('f_rent').value=p.rent;
  document.getElementById('f_note').value=p.note||'';
  document.getElementById('f_vacantSince').value=p.vacantSince||'';
  setSeg('f_cycleSeg',p.cycle);setSeg('f_statusSeg',p.pstatus);syncVac();
  showOverlay('propOverlay');
}
function syncVac(){document.getElementById('vacField').style.display=(curStatus==='vacant')?'block':'none';}
function setSeg(id,v){
  document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(id==='f_cycleSeg')curCycle=v;if(id==='f_statusSeg')curStatus=v;
}
document.querySelectorAll('#f_cycleSeg button').forEach(b=>b.onclick=()=>{setSeg('f_cycleSeg',b.dataset.v);});
document.querySelectorAll('#f_statusSeg button').forEach(b=>b.onclick=()=>{setSeg('f_statusSeg',b.dataset.v);syncVac();});
document.getElementById('propSave').onclick=()=>{
  const name=document.getElementById('f_name').value.trim();
  const rent=parseFloat(document.getElementById('f_rent').value);
  if(!name){toast('请填写房产名称');return;}
  if(isNaN(rent)||rent<0){toast('请填写正确租金');return;}
  if(editingPropId){
    const p=state.properties.find(x=>x.id===editingPropId);
    Object.assign(p,{name,address:document.getElementById('f_addr').value.trim(),rent,
      cycle:curCycle,pstatus:curStatus,
      vacantSince:curStatus==='vacant'?document.getElementById('f_vacantSince').value:'',
      note:document.getElementById('f_note').value.trim()});
    toast('已保存');
  } else {
    state.properties.push({id:uid(),name,address:document.getElementById('f_addr').value.trim(),rent,
      cycle:curCycle,pstatus:curStatus,
      vacantSince:curStatus==='vacant'?document.getElementById('f_vacantSince').value:'',
      note:document.getElementById('f_note').value.trim(),payments:[]});
    toast('已添加');
  }
  save();hideOverlay('propOverlay');render();
};

/* ---------- payment modal ---------- */
function openPay(pid,payId){
  editingPayPropId=pid;editingPayId=payId;
  const p=state.properties.find(x=>x.id===pid);
  if(payId){
    const pm=p.payments.find(x=>x.id===payId);
    document.getElementById('payTitle').textContent='修改收租记录';
    document.getElementById('p_amount').value=pm.amount;
    document.getElementById('p_date').value=pm.date;
    document.getElementById('p_note').value=pm.note||'';
  } else {
    document.getElementById('payTitle').textContent='收租 · '+p.name;
    document.getElementById('p_amount').value=p.rent;
    document.getElementById('p_date').value=today().toISOString().slice(0,10);
    document.getElementById('p_note').value='';
  }
  hideOverlay('sheetOverlay');showOverlay('payOverlay');
}
document.getElementById('paySave').onclick=()=>{
  const amt=parseFloat(document.getElementById('p_amount').value);
  const dt=document.getElementById('p_date').value;
  const note=document.getElementById('p_note').value.trim();
  if(isNaN(amt)||amt<0){toast('金额不正确');return;}
  if(!dt){toast('请选择日期');return;}
  const p=state.properties.find(x=>x.id===editingPayPropId);
  if(editingPayId){
    const pm=p.payments.find(x=>x.id===editingPayId);
    Object.assign(pm,{amount:amt,date:dt,note});toast('已修改');
  } else {
    p.payments.push({id:uid(),amount:amt,date:dt,note});toast('已收租');
  }
  save();hideOverlay('payOverlay');render();
};

/* ---------- overlay helpers ---------- */
function showOverlay(id){document.getElementById(id).classList.add('show');}
function hideOverlay(id){document.getElementById(id).classList.remove('show');}
document.getElementById('propCancel').onclick=()=>hideOverlay('propOverlay');
document.getElementById('payCancel').onclick=()=>hideOverlay('payOverlay');
['propOverlay','payOverlay','sheetOverlay'].forEach(id=>{
  document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)hideOverlay(id);});
});

/* ---------- nav ---------- */
document.querySelectorAll('nav .item').forEach(it=>it.onclick=()=>{
  document.querySelectorAll('nav .item').forEach(x=>x.classList.remove('active'));
  it.classList.add('active');
  const v=it.dataset.view;
  document.querySelectorAll('.view').forEach(s=>s.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.getElementById('fab').classList.toggle('show',v==='props');
});
document.getElementById('fab').onclick=openPropModal;
document.getElementById('addPropLink').onclick=openPropModal;

/* ---------- export / import ---------- */
document.getElementById('meExport').onclick=()=>{
  const data=JSON.stringify(state,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const name='租房管家手机版备份_'+today().toISOString().slice(0,10)+'.json';
  if(navigator.canShare&&navigator.canShare({files:[new File([blob],name,{type:'application/json'})]})){
    navigator.share({files:[new File([blob],name,{type:'application/json'})],title:'租房管家备份'}).catch(()=>{});
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  URL.revokeObjectURL(a.href);toast('已导出备份');
};
document.getElementById('meImport').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.properties)throw 0;state=migrate(d);save();render();toast('导入成功');}catch(err){toast('文件格式不正确');}};
  r.readAsText(f);e.target.value='';
};
document.getElementById('meLogout').onclick=()=>{logged=false;document.getElementById('app').style.display='none';document.getElementById('login').style.display='flex';};

/* ---------- login ---------- */
function doLogin(){
  const u=document.getElementById('lu').value.trim();
  const p=document.getElementById('lp').value;
  if(u===CRED.u&&p===CRED.p){
    logged=true;document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='flex';
    document.getElementById('fab').classList.add('show');
    render();
  } else {
    const c=document.getElementById('loginCard');c.classList.add('shake');
    document.getElementById('loginErr').textContent='账号或密码错误';
    setTimeout(()=>c.classList.remove('shake'),400);
  }
}
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('lp').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
document.getElementById('lu').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('lp').focus();});

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- swipe/refresh header date ---------- */
state=load();

/* ---------- service worker ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
